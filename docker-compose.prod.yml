services:
  app:
    build: .
    container_name: cotizador_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./lumi_files:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: cotizador_db
    restart: always
    env_file:
      - .env
    volumes:
      - lumi_data:/var/lib/postgresql/data
      - ./db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumi_data: