services:
  app:
    build: .
    container_name: cotizador_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - cotizador_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: cotizador_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - cotizador_pg_data:/var/lib/postgresql/data
      - ./db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cotizador_pg_data:
  cotizador_uploads:
