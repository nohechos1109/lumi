<svg width="168" height="46" viewBox="0 0 168 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonFace" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#EAB308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="46" height="46" fill="white"/>
      <circle cx="27" cy="17" r="14.5" fill="black"/>
    </mask>
    <linearGradient id="quotesGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Halo glow behind moon -->
  <circle cx="21" cy="23" r="22" fill="url(#moonGlow)"/>

  <!-- Moon crescent (mask-based, background-agnostic) -->
  <circle cx="21" cy="23" r="17" fill="url(#moonFace)" mask="url(#crescent)"/>

  <!-- Stars -->
  <circle cx="10"  cy="7"  r="1.5" fill="#FDE047" opacity="0.9"/>
  <circle cx="4"   cy="20" r="0.9" fill="#FDE047" opacity="0.55"/>
  <circle cx="38"  cy="6"  r="1.1" fill="#FDE047" opacity="0.7"/>
  <circle cx="36"  cy="32" r="0.7" fill="#FDE047" opacity="0.45"/>

  <!-- LUMI wordmark -->
  <text
    x="48" y="30"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="24"
    letter-spacing="3"
    fill="#FFFFFF"
  >LUMI</text>

  <!-- QUOTES label -->
  <text
    x="50" y="42"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="9"
    letter-spacing="4.5"
    fill="url(#quotesGold)"
  >QUOTES</text>
</svg>
