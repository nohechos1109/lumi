<svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonFace" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="glowBg" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="56" height="56" fill="white"/>
      <circle cx="31" cy="19" r="16" fill="black"/>
    </mask>
    <linearGradient id="lumiGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="quotesColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Glow halo -->
  <circle cx="24" cy="26" r="26" fill="url(#glowBg)"/>

  <!-- Moon crescent -->
  <circle cx="24" cy="26" r="20" fill="url(#moonFace)" mask="url(#crescent)"/>

  <!-- Stars -->
  <circle cx="12"  cy="8"  r="1.8" fill="#FDE047" opacity="0.9"/>
  <circle cx="5"   cy="22" r="1.1" fill="#FDE047" opacity="0.55"/>
  <circle cx="43"  cy="7"  r="1.3" fill="#FDE047" opacity="0.7"/>
  <circle cx="41"  cy="37" r="0.8" fill="#FDE047" opacity="0.45"/>

  <!-- LUMI wordmark in gold (visible on any background) -->
  <text
    x="55" y="35"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="2"
    fill="url(#lumiGold)"
  >LUMI</text>

  <!-- QUOTES label -->
  <text
    x="57" y="47"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="10"
    letter-spacing="5"
    fill="url(#quotesColor)"
  >QUOTES</text>
</svg>
