<svg width="120" height="100" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonBase" cx="36%" cy="30%" r="66%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#E8EDF5"/>
      <stop offset="78%"  stop-color="#B8C8D8"/>
      <stop offset="100%" stop-color="#7090A8"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="craterA" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#7A6650" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7A6650" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="craterB" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#8B7460" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#8B7460" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="craterC" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#7A6650" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7A6650" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lumiGrad" x1="20" y1="70" x2="100" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="saasGrad" x1="20" y1="90" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Moon centered at top -->
  <circle cx="60" cy="28" r="28" fill="url(#moonGlow)" filter="url(#blurGlow)"/>
  <circle cx="60" cy="28" r="24" fill="url(#moonBase)"/>

  <!-- Large crater -->
  <ellipse cx="56" cy="18" rx="6" ry="5.5" fill="url(#craterA)"/>
  <ellipse cx="56" cy="18" rx="6" ry="5.5" fill="none" stroke="#F5EDD8" stroke-width="0.6" opacity="0.35"/>
  <ellipse cx="54.5" cy="16.5" rx="1.5" ry="1" fill="#F5EDD8" opacity="0.3"/>

  <!-- Medium crater -->
  <ellipse cx="67" cy="26" rx="4.5" ry="4" fill="url(#craterB)"/>
  <ellipse cx="67" cy="26" rx="4.5" ry="4" fill="none" stroke="#F5EDD8" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="65.8" cy="24.8" rx="1.1" ry="0.8" fill="#F5EDD8" opacity="0.25"/>

  <!-- Small crater -->
  <ellipse cx="52" cy="36" rx="3.5" ry="3" fill="url(#craterC)"/>
  <ellipse cx="52" cy="36" rx="3.5" ry="3" fill="none" stroke="#F5EDD8" stroke-width="0.4" opacity="0.25"/>
  <ellipse cx="51" cy="35" rx="1" ry="0.7" fill="#F5EDD8" opacity="0.2"/>

  <!-- Tiny craters -->
  <circle cx="63" cy="38" r="1.8" fill="#7A6650" opacity="0.4"/>
  <circle cx="48" cy="24" r="1.5" fill="#7A6650" opacity="0.35"/>
  <circle cx="66" cy="16" r="1.3" fill="#7A6650" opacity="0.3"/>
  <circle cx="58" cy="40" r="1.2" fill="#7A6650" opacity="0.3"/>
  <circle cx="70" cy="35" r="1"   fill="#7A6650" opacity="0.3"/>

  <!-- Surface highlight -->
  <ellipse cx="52" cy="22" rx="7" ry="5" fill="#F5EDD8" opacity="0.1"/>
  <path d="M44 18 Q40 22 40 28 Q40 35 44 39" stroke="#F5F0E0" stroke-width="1" opacity="0.3" fill="none" stroke-linecap="round"/>

  <!-- LUMI text centered below moon -->
  <text
    x="60" y="76"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="26"
    letter-spacing="3"
    fill="url(#lumiGrad)"
  >LUMI</text>

  <!-- SAAS text centered below LUMI -->
  <text
    x="60" y="92"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="13"
    letter-spacing="7"
    fill="url(#saasGrad)"
  >S.A.A.S</text>
</svg>
